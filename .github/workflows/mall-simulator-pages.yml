name: Deploy Mall Simulator to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "mall-simulator/**"
      - ".github/workflows/mall-simulator-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mall-simulator-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static simulator
        uses: actions/upload-pages-artifact@v3
        with:
          path: mall-simulator

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
