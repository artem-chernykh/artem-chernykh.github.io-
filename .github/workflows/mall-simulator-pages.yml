name: Test Mall Simulator

on:
  push:
    branches:
      - main
    paths:
      - "docs/mall-simulator/**"
      - ".github/workflows/mall-simulator-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mall-simulator-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run simulator regression tests
        working-directory: docs/mall-simulator
        run: npm test
